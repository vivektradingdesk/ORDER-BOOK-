<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vivek Trading Desk | Live Order Book & DOM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: #0b0e11; color: #fff; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .brand-header {
      width: 100%;
      max-width: 440px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #181a20;
      border-radius: 8px;
      border: 1px solid #23272e;
    }
    .brand-title { font-size: 15px; font-weight: 700; color: #f0b90b; letter-spacing: 0.5px; }
    .live-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #0ecb81; font-weight: 600; }
    .dot { width: 8px; height: 8px; background: #0ecb81; border-radius: 50%; box-shadow: 0 0 8px #0ecb81; }

    .box { width: 100%; max-width: 440px; background: #12151c; border-radius: 8px; border: 1px solid #23272e; overflow: hidden; }
    .market-bar { padding: 12px 14px; background: #15181f; display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; border-bottom: 1px solid #23272e; }
    
    .row { display: flex; height: 30px; align-items: center; position: relative; font-size: 12px; border-bottom: 1px solid #1a1e26; }
    .bar { position: absolute; top: 0; bottom: 0; right: 0; opacity: 0.35; z-index: 1; }
    .bar-ask { background: #f6465d; }
    .bar-bid { background: #0ecb81; }
    .big-seller-bar { background: #ff5722 !important; opacity: 0.85; }

    .p-col { width: 95px; text-align: center; z-index: 2; color: #848e9c; font-weight: 600; }
    .q-col { width: 90px; text-align: right; z-index: 2; padding-right: 14px; font-weight: bold; }
    .t-col { flex: 1; z-index: 2; font-size: 11px; font-weight: bold; }
    
    .ltp-row { background: #1f2630; height: 36px; color: #ffeb3b; font-weight: bold; }
    
    .footer-bar {
      width: 100%;
      max-width: 440px;
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #848e9c;
    }
    .footer-bar a { color: #f0b90b; text-decoration: none; font-weight: 600; margin: 0 8px; }
  </style>
</head>
<body>

  <div class="brand-header">
    <div class="brand-title">🏛️ VIVEK TRADING DESK</div>
    <div class="live-badge"><div class="dot"></div> LIVE FEED</div>
  </div>

  <div class="box">
    <div class="market-bar">
      <span style="color: #eaecef">NIFTY (PER ₹1.00)</span>
      <span style="color: #0ecb81">LTP: <span id="ltp">166.00</span></span>
    </div>
    
    <div id="asks"></div>
    
    <div class="row ltp-row">
      <div class="p-col" id="midPrice">166.00</div>
      <div class="q-col">◀ LTP</div>
      <div class="t-col">Market Traded Price</div>
    </div>
    
    <div id="bids"></div>
  </div>

  <div class="footer-bar">
    <span>Powered by Vivek Trading Desk</span>
    <div style="margin-top: 6px;">
      <a href="#">Telegram</a> • <a href="#">Instagram</a>
    </div>
  </div>

  <script>
    let price = 166.00;
    function render() {
      price += (Math.random() - 0.49) * 0.4;
      document.getElementById('ltp').innerText = price.toFixed(2);
      document.getElementById('midPrice').innerText = price.toFixed(2);

      let asksHtml = '';
      for (let i = 6; i >= 1; i--) {
        let isBig = (i === 3);
        let qty = isBig ? 1085 : Math.floor(Math.random() * 120 + 30);
        let pct = Math.min((qty / 1200) * 100, 100);
        asksHtml += `
          <div class="row">
            <div class="bar bar-ask ${isBig ? 'big-seller-bar' : ''}" style="width: ${pct}%"></div>
            <div class="p-col">${(price + i).toFixed(2)}</div>
            <div class="q-col" style="color: #f6465d">${qty}</div>
            <div class="t-col" style="color: #ff9800">${isBig ? '⚠️ 1,085 Big Sellers' : ''}</div>
          </div>`;
      }
      document.getElementById('asks').innerHTML = asksHtml;

      let bidsHtml = '';
      for (let i = 1; i <= 6; i++) {
        let isBig = (i === 4);
        let qty = isBig ? 850 : Math.floor(Math.random() * 100 + 20);
        let pct = Math.min((qty / 1200) * 100, 100);
        bidsHtml += `
          <div class="row">
            <div class="bar bar-bid" style="width: ${pct}%"></div>
            <div class="p-col">${(price - i).toFixed(2)}</div>
            <div class="q-col" style="color: #0ecb81">${qty}</div>
            <div class="t-col" style="color: #0ecb81">${isBig ? '⚡ Big Buyers' : ''}</div>
          </div>`;
      }
      document.getElementById('bids').innerHTML = bidsHtml;
    }
    setInterval(render, 500);
  </script>
</body>
</html>
