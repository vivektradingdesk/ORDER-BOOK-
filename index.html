<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vivek Trading Desk | Order Flow Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: #06080c; color: #d1d4dc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Strip */
    .top-strip {
      background: #0d1017;
      border-bottom: 1px solid #1a1e28;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .brand { font-weight: 800; color: #f0b90b; font-size: 13px; display: flex; align-items: center; gap: 5px; }
    .live-dot { width: 6px; height: 6px; background: #0ecb81; border-radius: 50%; box-shadow: 0 0 6px #0ecb81; }

    /* Sub Header */
    .sub-strip {
      background: #080a0f;
      border-bottom: 1px solid #141822;
      padding: 4px 10px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #787b86;
    }

    /* Split Workspace */
    .terminal-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      width: 100%;
      position: relative;
    }

    /* Left: Live Candlestick Canvas */
    .chart-box {
      width: 48%;
      height: 100%;
      border-right: 1px solid #1a1e28;
      position: relative;
      background: #06080c;
    }
    #chartCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Right: DOM Ladder */
    .dom-box {
      width: 52%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #090c12;
      overflow: hidden;
      padding: 2px 0;
    }

    .ladder-row {
      display: flex;
      align-items: center;
      height: 23px;
      position: relative;
      font-size: 11px;
      border-bottom: 1px solid #10141d;
    }

    /* Horizontal Depth Bars */
    .depth-bar {
      position: absolute;
      top: 1px;
      bottom: 1px;
      right: 0;
      opacity: 0.35;
      z-index: 1;
      transition: width 0.15s ease-out;
    }
    .bar-ask { background: #f6465d; }
    .bar-bid { background: #0ecb81; }
    .whale-bar { background: #ff5722 !important; opacity: 0.85; }

    /* Column Typography */
    .cell { z-index: 2; padding: 0 4px; white-space: nowrap; }
    .c-vol-left { width: 38px; text-align: right; color: #5d606b; font-size: 9px; }
    .c-price { width: 52px; text-align: center; font-weight: 700; color: #9da3af; font-size: 10px; }
    .c-qty { width: 44px; text-align: right; font-weight: 800; font-size: 11px; }
    .c-tag { flex: 1; font-size: 9px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }

    .whale-label {
      background: #ff5722;
      color: #fff;
      padding: 1px 4px;
      border-radius: 2px;
      font-size: 8px;
    }
    .buyer-label {
      background: rgba(14, 203, 129, 0.2);
      color: #0ecb81;
      padding: 1px 4px;
      border-radius: 2px;
      font-size: 8px;
    }

    .current-market-row {
      background: #141a24;
      border-top: 1px solid #f0b90b88;
      border-bottom: 1px solid #f0b90b88;
      height: 26px;
      color: #f0b90b;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="top-strip">
    <div class="brand"><div class="live-dot"></div> VIVEK TRADING DESK</div>
    <div>NIFTY 25,600: <strong style="color: #0ecb81" id="topLtp">166.40</strong></div>
  </div>

  <div class="sub-strip">
    <span>Order Flow Footprint (Per ₹1.00)</span>
    <span id="countdown" style="color: #f0b90b">candle · 14s</span>
  </div>

  <div class="terminal-body">
    <!-- Left Hand: Pure Native Candlestick Engine -->
    <div class="chart-box">
      <canvas id="chartCanvas"></canvas>
    </div>

    <!-- Right Hand: Depth Ladder -->
    <div class="dom-box">
      <div id="asksContainer"></div>

      <div class="ladder-row current-market-row">
        <div class="cell c-vol-left">104</div>
        <div class="cell c-price" id="ladderMidPrice" style="color: #f0b90b">166.40</div>
        <div class="cell c-qty" style="color: #f0b90b">LTP</div>
        <div class="cell c-tag">◀ Market Traded</div>
      </div>

      <div id="bidsContainer"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Initial Candles
    let currentLtp = 166.00;
    let candles = [];
    let p = 164.00;
    for (let i = 0; i < 18; i++) {
      let open = p;
      let close = open + (Math.random() - 0.48) * 1.2;
      let high = Math.max(open, close) + Math.random() * 0.5;
      let low = Math.min(open, close) - Math.random() * 0.5;
      candles.push({ open, high, low, close });
      p = close;
    }
    currentLtp = p;

    // Render Canvas Candles
    function drawCandles() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // Grid Lines
      ctx.strokeStyle = '#121620';
      ctx.lineWidth = 1;
      for (let y = 30; y < h; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // Min/Max Price in View
      let min = Math.min(...candles.map(c => c.low));
      let max = Math.max(...candles.map(c => c.high));
      const range = (max - min) || 1;

      const candleWidth = Math.max((w / (candles.length + 2)) - 4, 4);

      candles.forEach((c, idx) => {
        const x = idx * (candleWidth + 4) + 8;
        const yOpen = h - ((c.open - min) / range) * (h - 20) - 10;
        const yClose = h - ((c.close - min) / range) * (h - 20) - 10;
        const yHigh = h - ((c.high - min) / range) * (h - 20) - 10;
        const yLow = h - ((c.low - min) / range) * (h - 20) - 10;

        const isGreen = c.close >= c.open;
        ctx.strokeStyle = isGreen ? '#0ecb81' : '#f6465d';
        ctx.fillStyle = isGreen ? '#0ecb81' : '#f6465d';

        // Wick
        ctx.beginPath();
        ctx.moveTo(x + candleWidth / 2, yHigh);
        ctx.lineTo(x + candleWidth / 2, yLow);
        ctx.stroke();

        // Body
        const top = Math.min(yOpen, yClose);
        const height = Math.max(Math.abs(yClose - yOpen), 2);
        ctx.fillRect(x, top, candleWidth, height);
      });

      // Horizontal LTP Line
      const curY = h - ((currentLtp - min) / range) * (h - 20) - 10;
      ctx.strokeStyle = '#f0b90b88';
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(0, curY);
      ctx.lineTo(w, curY);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Ladder Simulation
    let sec = 0;
    function updateTerminal() {
      currentLtp += (Math.random() - 0.49) * 0.35;
      currentLtp = Math.round(currentLtp * 20) / 20;

      document.getElementById('topLtp').innerText = currentLtp.toFixed(2);
      document.getElementById('ladderMidPrice').innerText = currentLtp.toFixed(2);

      sec = (sec + 1) % 60;
      document.getElementById('countdown').innerText = `candle · ${sec}s`;

      // Update Current Active Candle
      let lastCandle = candles[candles.length - 1];
      lastCandle.close = currentLtp;
      lastCandle.high = Math.max(lastCandle.high, currentLtp);
      lastCandle.low = Math.min(lastCandle.low, currentLtp);

      if (sec === 0) {
        candles.shift();
        candles.push({ open: currentLtp, high: currentLtp, low: currentLtp, close: currentLtp });
      }
      drawCandles();

      // Render Asks
      let asks = '';
      for (let i = 7; i >= 1; i--) {
        let price = (currentLtp + i * 1.0).toFixed(2);
        let isWhale = (i === 3);
        let qty = isWhale ? 1085 : Math.floor(Math.random() * 110 + 35);
        let pct = Math.min((qty / 1300) * 100, 100);
        let lVol = Math.floor(Math.random() * 80 + 15);

        asks += `
          <div class="ladder-row">
            <div class="depth-bar bar-ask ${isWhale ? 'whale-bar' : ''}" style="width: ${pct}%"></div>
            <div class="cell c-vol-left">${lVol}</div>
            <div class="cell c-price">${price}</div>
            <div class="cell c-qty" style="color: #f6465d">${qty}</div>
            <div class="cell c-tag">${isWhale ? '<span class="whale-label">1,085 Big</span>' : ''}</div>
          </div>`;
      }
      document.getElementById('asksContainer').innerHTML = asks;

      // Render Bids
      let bids = '';
      for (let i = 1; i <= 7; i++) {
        let price = (currentLtp - i * 1.0).toFixed(2);
        let isWhale = (i === 4);
        let qty = isWhale ? 850 : Math.floor(Math.random() * 95 + 25);
        let pct = Math.min((qty / 1300) * 100, 100);
        let lVol = Math.floor(Math.random() * 90 + 20);

        bids += `
          <div class="ladder-row">
            <div class="depth-bar bar-bid" style="width: ${pct}%"></div>
            <div class="cell c-vol-left">${lVol} bgt</div>
            <div class="cell c-price">${price}</div>
            <div class="cell c-qty" style="color: #0ecb81">${qty}</div>
            <div class="cell c-tag">${isWhale ? '<span class="buyer-label">⚡ Big Buyer</span>' : ''}</div>
          </div>`;
      }
      document.getElementById('bidsContainer').innerHTML = bids;
    }

    setInterval(updateTerminal, 400);
  </script>
</body>
</html>
